[project]
name = "waste2watt-ai-python"
version = "0.1.0"
description = "Python analysis, agent, and ML boundaries for Waste2Watt AI"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/shared/python", "services/analysis/src", "services/agent/src", "ml/src"]
extend-exclude = [".npm-cache", "node_modules", "dist", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
