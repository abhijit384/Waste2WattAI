version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node --version
            - npm --version
            - npm ci --cache .npm-cache --prefer-offline
            - node scripts/validate-hosting-config.mjs
        build:
          commands:
            - npm run build --workspace @waste2watt/shared
            - npm run build --workspace @waste2watt/web
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm-cache/**/*
